name: Release App

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "发布标签，例如 v0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-app-${{ github.event.inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        run: npm ci --prefix app

      - name: Verify tag matches app version
        run: npm --prefix app run verify:release-tag
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}

  build:
    name: Build ${{ matrix.platform.name }} ${{ matrix.platform.arch }}
    needs: validate-tag
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS
            runner: macos-latest
            target_flag: --mac
            arch: arm64
            arch_flag: --arm64
            artifact_name: app-macos-arm64-assets
          - name: macOS
            runner: macos-15-intel
            target_flag: --mac
            arch: x64
            arch_flag: --x64
            artifact_name: app-macos-x64-assets
          - name: Windows
            runner: windows-latest
            target_flag: --win
            arch: x64
            arch_flag: --x64
            artifact_name: app-windows-x64-assets
          - name: Linux
            runner: ubuntu-latest
            target_flag: --linux
            arch: x64
            arch_flag: --x64
            artifact_name: app-linux-x64-assets

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            web-app/package-lock.json

      - name: Install web-app dependencies
        run: npm ci --prefix web-app

      - name: Install app dependencies
        run: npm ci --prefix app

      - name: Typecheck web-app
        run: npm --prefix web-app run typecheck

      - name: Build desktop bundles
        run: npm --prefix app run dist:ci -- ${{ matrix.platform.target_flag }} ${{ matrix.platform.arch_flag }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Collect release assets
        run: node app/scripts/collect-release-assets.mjs app/release .artifacts/release-assets

      - name: Upload release assets
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.platform.artifact_name }}
          path: .artifacts/release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Download built assets
        uses: actions/download-artifact@v8
        with:
          path: .artifacts/downloaded-assets

      - name: Flatten release assets
        run: node app/scripts/collect-release-assets.mjs .artifacts/downloaded-assets .artifacts/publish-assets

      - name: Create release notes
        run: |
          cat <<'EOF' > .artifacts/release-notes.md
          Easy Teaching 桌面端发布包。

          - Web 前端来源：web-app
          - 桌面宿主：Electron app
          EOF

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail

          mapfile -d '' -t ASSET_FILES < <(find .artifacts/publish-assets -type f \( \
            -name "*.dmg" -o \
            -name "*.zip" -o \
            -name "*.deb" -o \
            -name "*.AppImage" -o \
            -name "*.exe" \
          \) -print0)

          if [[ ${#ASSET_FILES[@]} -eq 0 ]]; then
            echo "未找到可发布的构建产物"
            exit 1
          fi

          if [[ "${RELEASE_TAG}" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          else
            PRERELEASE_FLAG=""
          fi

          if gh release view "${RELEASE_TAG}" > /dev/null 2>&1; then
            mapfile -t EXISTING_ASSETS < <(gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name')

            for ASSET_NAME in "${EXISTING_ASSETS[@]}"; do
              gh release delete-asset "${RELEASE_TAG}" "${ASSET_NAME}" --yes
            done

            gh release upload "${RELEASE_TAG}" "${ASSET_FILES[@]}" --clobber
            gh release edit "${RELEASE_TAG}" \
              --title "Easy Teaching ${RELEASE_TAG}" \
              --notes-file .artifacts/release-notes.md \
              ${PRERELEASE_FLAG}
          else
            gh release create "${RELEASE_TAG}" "${ASSET_FILES[@]}" \
              --title "Easy Teaching ${RELEASE_TAG}" \
              --notes-file .artifacts/release-notes.md \
              ${PRERELEASE_FLAG}
          fi
